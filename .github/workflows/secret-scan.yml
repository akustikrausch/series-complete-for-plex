name: Secret Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan for secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Custom secret patterns check
        run: |
          echo "Scanning for project-specific secrets..."
          FOUND=0

          # Known project keys are matched by SHA-256 hash so the raw values
          # never appear in this (public) workflow file. Update these hashes
          # if the keys are rotated.
          KNOWN_KEY_HASHES="d112c9605ff8f4e6158dd13d16d473d0d12b0b9cac5b207bdaf5f0c746c47b49 414e1f828df32c09cf4911e488b4ea975672b8710b9d8eaf3ca82a2994df6b27 c8583a59b1004d6b427efb1c07c39b1c27dc27b2f49a07dab5354f073c6256a2"

          # Extract candidate tokens (hex32 / hex8 / UUID) and compare hashes.
          CANDIDATES=$(grep -rhoE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}|[a-f0-9]{32}|[a-f0-9]{8}' \
            --include='*.js' --include='*.json' --include='*.html' --include='*.py' --include='*.yaml' --include='*.yml' . 2>/dev/null \
            | grep -v '.env.example' | sort -u)
          for token in $CANDIDATES; do
            h=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
            case "$KNOWN_KEY_HASHES" in
              *"$h"*)
                echo "::error::Found a known project API key in source files!"
                FOUND=1
                ;;
            esac
          done

          if grep -rn "sk-proj-" --include='*.js' --include='*.json' --include='*.html' . 2>/dev/null | grep -v '.env.example'; then
            echo "::error::Found OpenAI API key in source files!"
            FOUND=1
          fi

          if grep -rn "DEMO_KEY" --include='*.js' . 2>/dev/null; then
            echo "::error::Found DEMO_KEY placeholder in source files!"
            FOUND=1
          fi

          # Personal data: any concrete user home path that is not a template
          if grep -rnE '(/mnt/c/Users/|/Users/|C:\\\\Users\\\\)[A-Za-z0-9._-]+' \
            --include='*.js' --include='*.json' --include='*.html' . 2>/dev/null \
            | grep -viE '\$\{?username|\[username\]|<username>|%USERNAME%|USERNAME'; then
            echo "::error::Found personal path in source files!"
            FOUND=1
          fi

          # Private files that should not exist
          for f in .env config.local.json CLAUDE.md SYNC-PLAN.md sync-to-public.sh analysis-cache.json; do
            if [ -f "$f" ]; then
              echo "::error::Private file '$f' found in repo!"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Secret scan FAILED!"
            exit 1
          fi

          echo "All secret checks passed."
